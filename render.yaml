services:
  - type: web
    name: reading-club
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    # Keeps seat reservations across deploys while Stripe is off.
    disk:
      name: reading-club-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ENROLLMENT_OPEN
        value: 'false'
      - key: SITE_URL
        sync: false
      - key: LOGIN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_DELIVERY_MODE
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MEMBER_PRICE_ID
        sync: false
      - key: DROPIN_PRICE_ID
        sync: false
      - key: SOURCE_PROMOS
        sync: false
      - key: BILLING_PORTAL_URL
        sync: false
      - key: BILLING_PORTAL_CONFIG_ID
        sync: false
